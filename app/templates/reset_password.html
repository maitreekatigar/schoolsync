{% extends 'base.html' %}{% block title %}Choose new password{% endblock %}{% block heading %}Choose new password{% endblock %}{% block content %}<section class="panel" style="max-width:520px;margin:2rem auto"><h2>Set a new password</h2><p>Choose a password with at least 12 characters.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" action="/reset-password" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ token }}"><label>New password<input type="password" name="password" required minlength="12" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm_password" required minlength="12" autocomplete="new-password"></label><button class="btn btn-primary" type="submit">Update password</button></form><p><a href="/login">Back to sign in</a></p></section>{% endblock %}
